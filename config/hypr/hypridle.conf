general {
    # Wait until the lock screen is visible before suspending or hibernating.
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3

    # Suspend 2 minutes after locking (LOCK_SLEEP_DELAY); unlocking cancels it.
    on_lock_cmd = ~/.config/hypr/scripts/lock-sleep.sh start
    on_unlock_cmd = ~/.config/hypr/scripts/lock-sleep.sh stop
}
