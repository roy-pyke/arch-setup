font_family JetBrainsMono Nerd Font
font_size 10
confirm_os_window_close 0

background #000000
foreground #ffffff

# Do not restore an old maximized window state.
remember_window_size no

# Mac-style clipboard shortcuts and an additional terminal interrupt key.
map alt+c copy_to_clipboard
map alt+v paste_from_clipboard
map ctrl+escape send_key ctrl+c
